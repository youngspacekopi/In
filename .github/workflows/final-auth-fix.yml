name: Final KOPIIN Master Auth Fix

on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - ".github/workflows/final-auth-fix.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: final-auth-fix
  cancel-in-progress: true

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Patch auth source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          rm -rf work site
          mkdir -p work site
          unzip -q "$ZIP_FILE" -d work
          PKG="$(find work -type f -name package.json -print -quit)"
          ROOT="$(dirname "$PKG")"

          python3 - "$ROOT" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          p = root / "src/context/PlatformContext.tsx"
          s = p.read_text()

          marker = "const KOPIIN_AUTH_BUILD_REVISION = '2026-09-30-master-fix-02';"
          if marker not in s:
              anchor = "const PlatformContext = createContext<PlatformContextType | undefined>(undefined);"
              assert anchor in s
              s = s.replace(anchor, marker + "\n\n" + anchor, 1)

          needle = "      login(INITIAL_USERS.PLATFORM_MASTER);\n      return { success: true };"
          replacement = """      login(INITIAL_USERS.PLATFORM_MASTER);
      recordAuditLog(INITIAL_USERS.PLATFORM_MASTER, 'MASTER_LOGIN_VERIFIED', 'platform:auth', {
        auth_revision: KOPIIN_AUTH_BUILD_REVISION,
        auth_system: 'KOPIIN_NATIVE_AUTH',
      });
      return { success: true };"""
          if needle in s:
              s = s.replace(needle, replacement, 1)
          elif "MASTER_LOGIN_VERIFIED" not in s:
              raise SystemExit("Master login success path not found")

          p.write_text(s)

          v = root / "vite.config.ts"
          if v.exists():
              s = v.read_text()
              s = s.replace("start_url: '/',\n          scope: '/',", "start_url: '/In/',\n          scope: '/In/',", 1)
              v.write_text(s)
          PY

          (cd "$ROOT" && npm install --legacy-peer-deps --no-audit --no-fund && npm run build -- --base=/In/)
          cp -a "$ROOT/dist/." "$GITHUB_WORKSPACE/site/"
          touch "$GITHUB_WORKSPACE/site/.nojekyll"
          test -s "$GITHUB_WORKSPACE/site/index.html"

          (cd "$ROOT" && zip -qr "$GITHUB_WORKSPACE/kopiin-final-fixed.zip" .)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv "$GITHUB_WORKSPACE/kopiin-final-fixed.zip" "$ZIP_FILE"
          git add "$ZIP_FILE"
          git commit -m "Fix master login success path" || true
          git push || true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy final auth fix
        id: deployment
        uses: actions/deploy-pages@v4
