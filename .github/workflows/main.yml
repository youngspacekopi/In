name: Build Web App and Android APK (KOPIIN)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL file ZIP eksternal untuk diekstrak (Opsional, kosongkan jika build langsung dari repo)'
        required: false
        default: ''

jobs:
  # =========================================================================
  # JOB 1: Build Web App & Ekstrak / Buat ZIP
  # =========================================================================
  build-web:
    name: 🌐 Build Web App & ZIP Packaging
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Ekstrak ZIP (Jika diberikan parameter URL ZIP eksternal)
        if: ${{ github.event.inputs.zip_url != '' }}
        run: |
          echo "Mengunduh file ZIP dari ${{ github.event.inputs.zip_url }}..."
          curl -L "${{ github.event.inputs.zip_url }}" -o source_archive.zip
          unzip -o source_archive.zip -d .
          echo "Ekstraksi ZIP selesai."

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: 🛠️ Lint Codebase
        run: |
          npm run lint || true

      - name: 🚀 Build Production Web App
        run: |
          npm run build

      - name: 🗜️ Compress Web App ke dist-kopiin-web.zip
        run: |
          zip -r dist-kopiin-web.zip dist/
          echo "dist-kopiin-web.zip berhasil dibuat."

      - name: 📤 Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopiin-web-build
          path: |
            dist/
            dist-kopiin-web.zip
          retention-days: 14

  # =========================================================================
  # JOB 2: Build Native Android APK (Capacitor + Gradle)
  # =========================================================================
  build-apk:
    name: 📱 Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📥 Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: kopiin-web-build

      - name: 📥 Install Node Dependencies & Capacitor
        run: |
          npm ci || npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save

      - name: 🔧 Inisialisasi Android Platform (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🛠️ Build Android Debug APK dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: 📋 Siapkan & Rename APK Output
        run: |
          mkdir -p output-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" output-apk/KOPIIN-POS-v1.0.0-debug.apk
            echo "APK berhasil disiapkan di output-apk/KOPIIN-POS-v1.0.0-debug.apk"
          else
            echo "Error: File APK tidak ditemukan!"
            exit 1
          fi

      - name: 🗜️ Buat ZIP Berisi APK
        run: |
          cd output-apk
          zip -r KOPIIN-Android-APK.zip KOPIIN-POS-v1.0.0-debug.apk
          cd ..

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopiin-android-apk
          path: |
            output-apk/KOPIIN-POS-v1.0.0-debug.apk
            output-apk/KOPIIN-Android-APK.zip
          retention-days: 14

  # =========================================================================
  # JOB 3: Bundling ZIP Paket Lengkap (Web + APK)
  # =========================================================================
  bundle-package:
    name: 📦 Bundle Master Release ZIP
    needs: [build-web, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4

      - name: 🗜️ Paketkan Semua File Rilis ke ZIP Tunggal
        run: |
          mkdir -p release-bundle
          cp -r kopiin-web-build/* release-bundle/ || true
          cp -r kopiin-android-apk/* release-bundle/ || true
          zip -r KOPIIN-POS-Full-Release-Package.zip release-bundle/
          echo "KOPIIN-POS-Full-Release-Package.zip berhasil dibuat."

      - name: 📤 Upload Full Release ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOPIIN-Full-Release-Package
          path: KOPIIN-POS-Full-Release-Package.zip
          retention-days: 30
