name: Build Web App and Android APK (KOPIIN)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL file ZIP eksternal (Opsional jika file ZIP sudah di-upload ke repo)'
        required: false
        default: ''

jobs:
  build-and-package:
    name: 🚀 Ekstrak ZIP, Build Web & Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Repositori
        uses: actions/checkout@v4

      - name: 📦 2. Deteksi & Ekstrak File ZIP Proyek
        run: |
          echo "=========================================================="
          echo "🔍 MEMERIKSA FILE DI REPOSITORI GITHUB..."
          echo "=========================================================="
          pwd
          ls -la

          # A. Jika user memasukkan URL zip di workflow_dispatch
          if [ -n "${{ github.event.inputs.zip_url }}" ]; then
            echo "Mengunduh file ZIP dari URL..."
            curl -L "${{ github.event.inputs.zip_url }}" -o uploaded_source.zip
          fi

          # B. Cari file .zip yang ada di repositori
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "✅ Menemukan file ZIP: $ZIP_FILE"
            echo "Mengekstrak file ZIP..."
            mkdir -p temp_extracted
            unzip -q -o "$ZIP_FILE" -d temp_extracted

            # Cari lokasi package.json di dalam hasil ekstrak
            PKG_LOC=$(find temp_extracted -name "package.json" | head -n 1)

            if [ -n "$PKG_LOC" ]; then
              PROJECT_DIR=$(dirname "$PKG_LOC")
              echo "✅ package.json ditemukan di dalam folder: $PROJECT_DIR"
              echo "Memindahkan seluruh file source code ke root repositori..."
              cp -r "$PROJECT_DIR"/* .
              cp -r "$PROJECT_DIR"/.[!.]* . 2>/dev/null || true
              rm -rf temp_extracted
            else
              echo "Mengekstrak langsung ke root..."
              unzip -q -o "$ZIP_FILE" -d .
              rm -rf temp_extracted
            fi
          else
            echo "ℹ️ Tidak ada file .zip baru, menggunakan file yang sudah ada di repo."
          fi

          # C. Cek apakah package.json ada di dalam subdirektori manapun
          if [ ! -f "package.json" ]; then
            PKG_ANYWHERE=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$PKG_ANYWHERE" ]; then
              DIR_CONTAINING_PKG=$(dirname "$PKG_ANYWHERE")
              echo "Memindahkan file dari $DIR_CONTAINING_PKG ke root..."
              cp -r "$DIR_CONTAINING_PKG"/* .
              cp -r "$DIR_CONTAINING_PKG"/.[!.]* . 2>/dev/null || true
            fi
          fi

          # D. Validasi keberadaan package.json
          if [ ! -f "package.json" ]; then
            echo "❌ ERROR: File package.json belum ditemukan!"
            exit 1
          fi

          echo "=========================================================="
          echo "✅ Source code siap! Daftar file root:"
          ls -la
          echo "=========================================================="

      - name: ⚙️ 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ 4. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 5. Konfigurasi Android SDK (Native Runner) & Lisensi
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          yes | sdkmanager --licenses 2>/dev/null || yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          echo "✅ Android SDK bawaan GitHub siap digunakan."

      - name: 📥 6. Install Dependencies (NPM)
        run: |
          npm install --legacy-peer-deps

      - name: 🛠️ 7. Lint Codebase
        run: |
          npm run lint || true

      - name: 🚀 8. Build Production Web App
        run: |
          npm run build
          zip -r KOPIIN-Web-dist.zip dist/
          echo "KOPIIN-Web-dist.zip berhasil dibuat."

      - name: 📱 9. Siapkan Capacitor & Build APK Android
        run: |
          echo "Menginstall dependensi Capacitor..."
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save --legacy-peer-deps

          if [ ! -f "capacitor.config.json" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "id.kopiin.app",
            "appName": "KOPIIN POS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          echo "Memulai kompilasi Gradle untuk APK Android..."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

          mkdir -p output-apk
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" output-apk/KOPIIN-POS-v1.0.0-debug.apk
            cd output-apk
            zip -r KOPIIN-Android-APK.zip KOPIIN-POS-v1.0.0-debug.apk
            cd ..
            echo "✅ APK Android berhasil dibuat: output-apk/KOPIIN-POS-v1.0.0-debug.apk"
          else
            echo "❌ File APK tidak ditemukan di path default Gradle."
            exit 1
          fi

      - name: 📦 10. Buat Paket Rilis Master ZIP (Web + APK)
        run: |
          mkdir -p release-bundle
          cp -r dist release-bundle/web-dist
          cp KOPIIN-Web-dist.zip release-bundle/
          cp output-apk/KOPIIN-POS-v1.0.0-debug.apk release-bundle/
          cp output-apk/KOPIIN-Android-APK.zip release-bundle/
          zip -r KOPIIN-Full-Release-Package.zip release-bundle/
          echo "✅ KOPIIN-Full-Release-Package.zip berhasil dibuat."

      - name: 📤 11. Upload File APK Android (Download Langsung)
        uses: actions/upload-artifact@v4
        with:
          name: KOPIIN-Android-APK
          path: |
            output-apk/KOPIIN-POS-v1.0.0-debug.apk
            output-apk/KOPIIN-Android-APK.zip
          retention-days: 30

      - name: 📤 12. Upload Web App Dist
        uses: actions/upload-artifact@v4
        with:
          name: KOPIIN-Web-Dist
          path: |
            dist/
            KOPIIN-Web-dist.zip
          retention-days: 14

      - name: 📤 13. Upload Paket Lengkap (Web + APK)
        uses: actions/upload-artifact@v4
        with:
          name: KOPIIN-Full-Release-Package
          path: KOPIIN-Full-Release-Package.zip
          retention-days: 30
