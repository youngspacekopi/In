name: KOPIIN - Web + Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Project ZIP was not found in repository."
            exit 1
          fi
          echo "Using: $ZIP_FILE"
          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          PKG="$(find project -type f -name package.json -print -quit)"
          if [ -z "$PKG" ]; then
            echo "::error::package.json was not found inside the project ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PKG")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Package web artifact
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -d dist
          cd dist
          zip -qr ../../kopiin-web-build.zip .

      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: kopiin-web-build
          path: kopiin-web-build.zip
          if-no-files-found: error
          retention-days: 14

      - name: Install Capacitor 8
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --save-exact @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 --legacy-peer-deps --no-audit --no-fund

      - name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::APK was not produced."
            exit 1
          fi
          mkdir -p output-apk
          cp "$APK" output-apk/KOPIIN-POS-debug.apk
          (cd output-apk && sha256sum KOPIIN-POS-debug.apk > SHA256SUMS.txt)
          zip -qr KOPIIN-POS-Android.zip output-apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kopiin-android-apk
          path: |
            project/KOPIIN-POS-Android.zip
            project/output-apk/KOPIIN-POS-debug.apk
            project/output-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
