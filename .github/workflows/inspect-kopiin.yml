name: Inspect KOPIIN Source
on:
  push:
    paths:
      - "kopiin (6).zip"
      - ".github/workflows/inspect-kopiin.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect
        run: |
          set -e
          rm -rf work
          mkdir work
          unzip -q "kopiin (6).zip" -d work
          echo "=== TREE ==="
          find work -maxdepth 4 -type f | sort | head -300
          echo "=== AUTH REFERENCES ==="
          grep -RInE "supabase\.auth|from\(['\"]|login|register|master|password|users|profiles|localStorage|session" work --exclude-dir=node_modules --exclude='*.map' | head -1000 || true
          echo "=== PACKAGE FILES ==="
          find work -name package.json -o -name vite.config.* -o -name '*.sql' | sort
