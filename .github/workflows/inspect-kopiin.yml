name: Inspect KOPIIN Source
on:
  push:
    paths:
      - "kopiin (6).zip"
      - ".github/workflows/inspect-kopiin.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect
        run: |
          set -e
          rm -rf work
          mkdir work
          unzip -q "kopiin (6).zip" -d work
          echo "=== AUTH FILE ==="
          sed -n '1,380p' work/src/lib/auth/kopiinAuth.ts
          echo "=== PLATFORM CONTEXT AUTH ==="
          sed -n '120,330p' work/src/context/PlatformContext.tsx
          echo "=== SCHEMA USERS ==="
          sed -n '1,90p' work/src/lib/supabase/schema.sql
          echo "=== SUPABASE CLIENT ==="
          cat work/src/lib/supabase/client.ts
          echo "=== SUPABASE ENV ==="
          cat work/.env.example
          tar -czf kopiin-source.tgz -C work .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: kopiin-source
          path: kopiin-source.tgz
