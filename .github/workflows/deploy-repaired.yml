name: Deploy Repaired KOPIIN

on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - ".github/workflows/deploy-repaired.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-repaired
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract and build repaired project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          rm -rf work site
          mkdir -p work site
          unzip -q "$ZIP_FILE" -d work
          PKG="$(find work -type f -name package.json -print -quit)"
          ROOT="$(dirname "$PKG")"
          cd "$ROOT"
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build -- --base=/In/
          test -d dist
          cp -a dist/. "$GITHUB_WORKSPACE/site/"
          touch "$GITHUB_WORKSPACE/site/.nojekyll"
          test -s "$GITHUB_WORKSPACE/site/index.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy repaired site
        id: deployment
        uses: actions/deploy-pages@v4
