name: KOPIIN Final Build Verified
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract ZIP
        run: |
          set -e
          z=$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)
          mkdir project
          unzip -q "$z" -d project
          p=$(find project -type f -name package.json -not -path '*/node_modules/*' -print -quit)
          echo "DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Hide Master demo option
        working-directory: ${{ env.DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/presentation/LoginPage.tsx')
          s=p.read_text()
          n='bg-purple-100 hover:bg-purple-200 text-purple-950 border border-purple-300 rounded-lg text-[10px] font-bold cursor-pointer'
          if s.count(n)!=1: raise SystemExit('Master demo button pattern missing')
          p.write_text(s.replace(n,'hidden '+n,1))
          PY
      - name: Harden actual login email normalization
        working-directory: ${{ env.DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/PlatformContext.tsx')
          s=p.read_text()
          old="const trimmedEmail = email.trim().toLowerCase();"
          new="const trimmedEmail = email.normalize('NFKC').replace(/[\\u200B-\\u200D\\uFEFF]/g, '').replace(/\\s/g, '').toLowerCase();"
          if s.count(old)!=1:
            raise SystemExit(f'Login normalization target not found uniquely: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          print('LOGIN_NORMALIZATION_V2=patched')
          PY
      - name: Install dependencies
        working-directory: ${{ env.DIR }}
        run: |
          node -e "const fs=require('fs'),p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.overrides=Object.assign({},j.overrides,{'electron-to-chromium':'1.5.439'});fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          rm -f package-lock.json npm-shrinkwrap.json
          npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build web for GitHub Pages
        working-directory: ${{ env.DIR }}
        run: npm run build -- --base=/In/
      - name: Replace stale service worker with network-only recovery worker
        working-directory: ${{ env.DIR }}
        run: |
          cat > dist/sw.js <<'SW'
          self.addEventListener('install',()=>self.skipWaiting());
          self.addEventListener('activate',event=>event.waitUntil((async()=>{
            await self.clients.claim();
            await self.registration.unregister();
            const clients=await self.clients.matchAll({type:'window'});
            for(const c of clients){try{await c.navigate(c.url)}catch{}}
          })()));
          self.addEventListener('fetch',event=>{
            if(event.request.method!=='GET') return;
            event.respondWith(fetch(event.request,{cache:'no-store'}).catch(()=>caches.match(event.request)));
          });
          SW
      - name: Clear stale client state and verify master identity
        working-directory: ${{ env.DIR }}
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/index.html')
          s=p.read_text()
          cleanup='''<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><script>(async()=>{try{if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches' in window){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}})()</script>'''
          if cleanup not in s:
            s=s.replace('<head>', '<head>'+cleanup, 1)
          p.write_text(s)
          js='\n'.join(x.read_text(errors='ignore') for x in Path('dist/assets').glob('*.js'))
          for required in ['mdqputra@gmail.com','PLATFORM_MASTER']:
            if required not in js:
              raise SystemExit(f'Master login verification failed: missing {required}')
          PY
          test -s dist/index.html
      - name: Disable stale PWA service worker and force fresh client bundle
        working-directory: ${{ env.DIR }}
        run: |
          set -e
          rm -f dist/sw.js dist/registerSW.js dist/workbox-*.js
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('dist/index.html')
          s=p.read_text()
          # Remove every PWA registration tag variant, including Vite's id/crossorigin form.
          s=re.sub(r'<script[^>]+(?:registerSW\\.js|vite-plugin-pwa:register-sw)[^>]*></script>', '', s, flags=re.I)
          # Bust browser caches for the generated JS/CSS on every GitHub commit.
          v=os.environ.get('GITHUB_SHA','unknown')
          s=re.sub(r'(src="/In/assets/[^"]+\\.js)"', r'\\1?v='+v, s)
          s=re.sub(r'(href="/In/assets/[^"]+\\.css)"', r'\\1?v='+v, s)
          p.write_text(s)
          Path('dist/404.html').write_text(s)
          PY
          test ! -e dist/sw.js
          test ! -e dist/registerSW.js
          ! grep -q 'registerSW.js' dist/index.html
          grep -q "mdqputra@gmail.com" dist/assets/*.js
          grep -q "PLATFORM_MASTER" dist/assets/*.js
      - name: Normalize GitHub Pages paths
        working-directory: ${{ env.DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist/index.html')
          s=p.read_text()
          replacements={
            'src="/assets/':'src="/In/assets/',
            'href="/assets/':'href="/In/assets/',
            'href="/icon.svg"':'href="/In/icon.svg"',
            'href="/manifest.webmanifest"':'href="/In/manifest.webmanifest"',
            'src="/registerSW.js"':'src="/In/registerSW.js"',
          }
          for a,b in replacements.items():
            s=s.replace(a,b)
          p.write_text(s)
          Path('dist/404.html').write_text(s)
          if 'src="/assets/' in s or 'href="/assets/' in s:
            raise SystemExit('Unfixed root asset path remains in index.html')
          if 'src="/In/assets/' not in s:
            raise SystemExit('Pages asset path missing from index.html')
          PY
          echo "Verified GitHub Pages base paths:"
          grep -oE '(src|href)="[^"]+"' dist/index.html | head -20
      - name: Final browser cache bust
        working-directory: ${{ env.DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('dist/index.html')
          s=p.read_text()
          v=os.environ['GITHUB_SHA']
          for marker in ['src="/In/assets/','href="/In/assets/']:
            parts=s.split(marker)
            out=parts[0]
            for part in parts[1:]:
              end=part.find('"')
              if end >= 0 and '?v=' not in part[:end]:
                part=part[:end]+'?v='+v+part[end:]
              out+=marker+part
            s=out
          p.write_text(s)
          Path('dist/404.html').write_text(s)
          PY
          grep -q "?v=${GITHUB_SHA}" dist/index.html
      - name: Production web check
        working-directory: ${{ env.DIR }}
        run: test -s dist/index.html
      - name: Verify web
        working-directory: ${{ env.DIR }}
        run: test -s dist/index.html
      - name: Install Capacitor
        working-directory: ${{ env.DIR }}
        run: npm install --save-exact @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 --legacy-peer-deps --no-audit --no-fund
      - name: Build Android
        working-directory: ${{ env.DIR }}
        run: |
          set -e
          if [ ! -f capacitor.config.json ]; then
            printf '%s\n' '{"appId":"com.kopiin.platform","appName":"KOPIIN","webDir":"dist","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: kopiin-web-verified
          path: ${{ env.DIR }}/dist
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kopiin-apk-verified
          path: ${{ env.DIR }}/android/app/build/outputs/apk/debug/*.apk
