name: Diagnose KOPIIN Master Login Source
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: |
          set -e
          z=$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)
          mkdir -p project
          unzip -q "$z" -d project
          p=$(find project -type f -name package.json -print -quit)
          echo "DIR=$(dirname "$p")" >> "$GITHUB_ENV"
      - name: Print relevant source
        working-directory: ${{ env.DIR }}
        run: |
          echo '=== RBAC ==='
          sed -n '150,175p' src/lib/auth/rbac.ts
          echo '=== AUTH ==='
          sed -n '225,265p' src/context/PlatformContext.tsx
          echo '=== LOGIN ==='
          sed -n '1,150p' src/components/presentation/LoginPage.tsx
