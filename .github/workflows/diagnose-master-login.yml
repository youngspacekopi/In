name: Diagnose KOPIIN Master Login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest ZIP
        run: |
          set -e
          zip=$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)
          rm -rf project
          mkdir project
          unzip -q "$zip" -d project
          pkg=$(find project -type f -name package.json -print -quit)
          test -n "$pkg"
          echo "PROJECT_DIR=$(dirname "$pkg")" >> "$GITHUB_ENV"
      - name: Inspect auth source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          echo '=== RBAC 150-275 ==='
          sed -n '150,275p' src/lib/auth/rbac.ts
          echo '=== PLATFORM CONTEXT 220-270 ==='
          sed -n '220,270p' src/context/PlatformContext.tsx
          echo '=== LOGIN HANDLER 1-150 ==='
          sed -n '1,150p' src/components/presentation/LoginPage.tsx
