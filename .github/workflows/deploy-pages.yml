name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "kopiin (5).zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site work
          mkdir -p work site
          unzip -q "kopiin (5).zip" -d work

          echo "ZIP contents:"
          find work -maxdepth 4 -type f | sort | head -200

          # Prefer an index.html already present in the extracted project.
          INDEX="$(find work -type f -name index.html -print -quit || true)"

          if [ -n "$INDEX" ]; then
            ROOT="$(dirname "$INDEX")"
            echo "Static entry found at: $INDEX"
            cp -a "$ROOT"/. site/
          else
            # If the ZIP is source code for a Node frontend, build it.
            PKG="$(find work -type f -name package.json -print -quit || true)"
            if [ -z "$PKG" ]; then
              echo "::error::No index.html or package.json found in kopiin (5).zip"
              exit 1
            fi

            ROOT="$(dirname "$PKG")"
            cd "$ROOT"

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            npm run build

            for DIR in dist build out; do
              if [ -d "$DIR" ]; then
                cp -a "$DIR"/. "$GITHUB_WORKSPACE/site/"
                break
              fi
            done

            if [ ! -f "$GITHUB_WORKSPACE/site/index.html" ]; then
              echo "::error::Build completed but no deployable index.html was found."
              exit 1
            fi
          fi

          touch site/.nojekyll
          test -f site/index.html
          echo "Deployable site:"
          find site -maxdepth 2 -type f | sort | head -200

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
