name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work site
          mkdir -p work site
          ZIP_FILE="$(find . -maxdepth 1 -type f -name "*.zip" -printf "%T@ %p\n" | sort -nr | head -n1 | cut -d" " -f2-)"
          if [ -z "$ZIP_FILE" ]; then echo "::error::No project ZIP found."; exit 1; fi
          echo "Using latest ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d work
          echo "=== ZIP STRUCTURE ==="
          find work -type f | sort | head -500

      - name: Hide extra autofill option
        shell: bash
        run: |
          set -euo pipefail
          PKG="$(find work -type f -name package.json -not -path '*/node_modules/*' -print -quit || true)"
          if [ -z "$PKG" ]; then
            echo "Static project; no source transformation required."
            exit 0
          fi
          ROOT="$(dirname "$PKG")"
          python3 - <<PY
          from pathlib import Path
          p = Path("$ROOT/src/components/presentation/LoginPage.tsx")
          if not p.exists():
              raise SystemExit('LoginPage.tsx not found in latest ZIP.')
          s = p.read_text()
          needle = 'bg-purple-100 hover:bg-purple-200 text-purple-950 border border-purple-300 rounded-lg text-[10px] font-bold cursor-pointer'
          if s.count(needle) != 1:
              raise SystemExit('Expected exactly one purple demo autofill button.')
          p.write_text(s.replace(needle, 'hidden ' + needle, 1))
          print('Extra autofill option hidden for Pages build.')
          PY

      - name: Build project for Pages
        shell: bash
        run: |
          set -euo pipefail
          PKG="$(find work -type f -name package.json -not -path '*/node_modules/*' -print -quit || true)"
          if [ -n "$PKG" ]; then
            ROOT="$(dirname "$PKG")"
            echo "Using project root: $ROOT"
            cd "$ROOT"

            echo "=== package.json ==="
            cat package.json

            node -e "const fs=require('fs'); const p='package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.overrides=Object.assign({},j.overrides,{ 'electron-to-chromium':'1.5.439' }); fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n');"
            rm -f package-lock.json npm-shrinkwrap.json
            npm install --legacy-peer-deps

            npm run build -- --base=/In/

            FOUND=0
            for DIR in dist build out; do
              if [ -d "$DIR" ]; then
                echo "Using build output: $DIR"
                cp -a "$DIR"/. "$GITHUB_WORKSPACE/site/"
                FOUND=1
                break
              fi
            done

            if [ "$FOUND" -eq 0 ]; then
              echo "::error::npm build completed but no dist/, build/, or out/ directory was produced."
              exit 1
            fi
          else
            INDEX="$(find work -type f -name index.html -print -quit || true)"
            if [ -z "$INDEX" ]; then
              echo "::error::No package.json or index.html found in ZIP."
              exit 1
            fi
            ROOT="$(dirname "$INDEX")"
            echo "Static site root: $ROOT"
            cp -a "$ROOT"/. "$GITHUB_WORKSPACE/site/"
          fi

          touch "$GITHUB_WORKSPACE/site/.nojekyll"

          # Force clients away from stale PWA/service-worker caches.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          s = p.read_text()
          marker = '<meta name="kopiin-build" content="2026-09-30-master-login-fix-01">'
          if 'name="kopiin-build"' not in s:
              s = s.replace('<head>', '<head>\\n' + marker, 1)
          p.write_text(s)
          PY

          if [ ! -s "$GITHUB_WORKSPACE/site/index.html" ]; then
            echo "::error::Final Pages artifact has no non-empty index.html."
            exit 1
          fi

          echo "=== FINAL PAGES FILES ==="
          find "$GITHUB_WORKSPACE/site" -type f | sort | head -500
          echo "=== index.html size ==="
          wc -c "$GITHUB_WORKSPACE/site/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
