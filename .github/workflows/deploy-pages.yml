name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "kopiin (5).zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work site
          mkdir -p work site
          unzip -q "kopiin (5).zip" -d work
          echo "=== ZIP STRUCTURE ==="
          find work -type f | sort | head -500

      - name: Build project for Pages
        shell: bash
        run: |
          set -euo pipefail
          PKG="$(find work -type f -name package.json -not -path '*/node_modules/*' -print -quit || true)"
          if [ -n "$PKG" ]; then
            ROOT="$(dirname "$PKG")"
            echo "Using project root: $ROOT"
            cd "$ROOT"

            echo "=== package.json ==="
            cat package.json

            if [ -f package-lock.json ]; then
              npm ci --legacy-peer-deps
            else
              npm install --legacy-peer-deps
            fi

            npm run build -- --base=/In/

            FOUND=0
            for DIR in dist build out; do
              if [ -d "$DIR" ]; then
                echo "Using build output: $DIR"
                cp -a "$DIR"/. "$GITHUB_WORKSPACE/site/"
                FOUND=1
                break
              fi
            done

            if [ "$FOUND" -eq 0 ]; then
              echo "::error::npm build completed but no dist/, build/, or out/ directory was produced."
              exit 1
            fi
          else
            INDEX="$(find work -type f -name index.html -print -quit || true)"
            if [ -z "$INDEX" ]; then
              echo "::error::No package.json or index.html found in ZIP."
              exit 1
            fi
            ROOT="$(dirname "$INDEX")"
            echo "Static site root: $ROOT"
            cp -a "$ROOT"/. "$GITHUB_WORKSPACE/site/"
          fi

          touch "$GITHUB_WORKSPACE/site/.nojekyll"

          if [ ! -s "$GITHUB_WORKSPACE/site/index.html" ]; then
            echo "::error::Final Pages artifact has no non-empty index.html."
            exit 1
          fi

          echo "=== FINAL PAGES FILES ==="
          find "$GITHUB_WORKSPACE/site" -type f | sort | head -500
          echo "=== index.html size ==="
          wc -c "$GITHUB_WORKSPACE/site/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
