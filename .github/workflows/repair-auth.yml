name: Repair KOPIIN Auth Cache

on:
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - ".github/workflows/repair-auth.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh auth bundle and PWA scope
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          rm -rf work repaired
          mkdir work repaired
          unzip -q "$ZIP_FILE" -d work
          PKG="$(find work -type f -name package.json -print -quit)"
          test -n "$PKG"
          ROOT="$(dirname "$PKG")"

          python3 - "$ROOT" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])

          p = root / "src/context/PlatformContext.tsx"
          s = p.read_text()
          marker = "const KOPIIN_AUTH_BUILD_REVISION = '2026-09-30-master-fix-01';"
          if marker not in s:
              anchor = "const PlatformContext = createContext<PlatformContextType | undefined>(undefined);"
              assert anchor in s
              s = s.replace(anchor, marker + "\n\n" + anchor, 1)
              p.write_text(s)

          v = root / "vite.config.ts"
          if v.exists():
              s = v.read_text()
              s = s.replace("start_url: '/',\n          scope: '/',", "start_url: '/In/',\n          scope: '/In/',", 1)
              v.write_text(s)
          PY

          (cd "$ROOT" && zip -qr "$GITHUB_WORKSPACE/repaired/kopiin-fixed.zip" .)
          mv "$GITHUB_WORKSPACE/repaired/kopiin-fixed.zip" "$ZIP_FILE"

          rm -f .github/workflows/temp-auth-inspect.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ZIP_FILE" .github/workflows/temp-auth-inspect.yml
          if git diff --cached --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git commit -m "Refresh master auth bundle and PWA cache"
          git push
